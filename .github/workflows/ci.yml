name: CloneProof CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run CloneProof's own tests
        run: npm test

      - name: Check the sample project
        run: node src/cli.js ./sample-project ./cloneproof-report.md

      - name: Test the sample app
        working-directory: sample-project
        run: |
          npm ci
          npm test
          npm run dev
